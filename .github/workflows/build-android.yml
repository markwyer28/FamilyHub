name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare APK-only Family Hub settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          start=s.find('<article class="card settings-card backup-card"><h3>💾 Backup & restore</h3>')
          if start >= 0:
              end=s.find('</article>', start)
              if end >= 0: s=s[:start]+s[end+10:]
          s=s.replace('</head>','<link rel="stylesheet" href="assets/settings-patch.css?v=2"></head>')
          s=s.replace('</body>','<script src="assets/settings-patch.js?v=2"></script><script src="assets/familyhub-fixes.js?v=1"></script></body>')
          p.write_text(s)
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Enable Android network and immersive fullscreen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest #<manifest #g' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          cat > android/app/src/main/java/uk/familyhub/app/MainActivity.java <<'JAVA'
          package uk.familyhub.app;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override protected void onCreate(Bundle savedInstanceState){super.onCreate(savedInstanceState);hideSystemUI();}
            @Override public void onWindowFocusChanged(boolean hasFocus){super.onWindowFocusChanged(hasFocus);if(hasFocus)hideSystemUI();}
            private void hideSystemUI(){
              if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.R){
                WindowInsetsController c=getWindow().getInsetsController();
                if(c!=null){c.hide(WindowInsets.Type.statusBars()|WindowInsets.Type.navigationBars());c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);}
              }else{
                getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }
            }
          }
          JAVA

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
